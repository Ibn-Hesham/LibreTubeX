name: Build and release app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # keystore.properties (read by app/build.gradle.kts) makes
      # assembleRelease sign the APK itself; storeFile resolves relative
      # to the app/ module, hence the keystore living in app/
      - name: Set up release signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the ANDROID_RELEASE_SIGNING_KEY/KEY_ALIAS/KEYSTORE_PASSWORD/KEY_PASSWORD secrets are not all configured"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > app/upload.keystore
          # java.util.Properties consumes backslash escapes, so double them
          {
            printf 'storeFile=upload.keystore\n'
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
          } > keystore.properties

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      # Create a summary based on the latest fastlane metadata changelog
      - name: Create changelog summary
        id: changelog-summary
        run: |
            summary_file=$(find fastlane/metadata/android/en-US/changelogs/ | sort -t '/' -k 6n | tail -n 1) # get name of latest changelog file
            summary_quoted=$(cat "$summary_file" | xargs -d '\n' -I {} echo "> {}") # prefix each line with "> "
            summary=$(echo -e "> [!NOTE]\n> ## Release Highlights\n$summary_quoted") # format as GitHub markdown admonitions
            echo "summary<<EOF"$'\n'"$summary"$'\n'EOF >> $GITHUB_OUTPUT # make available as actions output
            

      - name: Rename apk file
        run: mv app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body:
            ${{ steps.changelog-summary.outputs.summary }}

            ${{ steps.changelog.outputs.changes }}
          files: "app-release.apk"
          fail_on_unmatched_files: true
          make_latest: true
