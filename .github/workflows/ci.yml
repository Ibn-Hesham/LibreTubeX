name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

# a new push cancels any run still in flight for the same branch, so an
# older run can never finish last and steal the release "latest" flag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-builds:
    runs-on: ubuntu-latest
    env:
      # job-level so the Sign Apk step's `if` can see it (step env is not);
      # when unset the artifact is left debug-signed instead of failing
      SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Compile
        run: |
          ./gradlew assembleDebug

      # re-sign the debug APK with the fixed key when the secrets are
      # configured, so the artifact installs as an update over previous CI
      # builds; without them the artifact stays debug-signed (the `if` is
      # on the job-level SIGNING_KEY env, as a step cannot see its own env)
      - name: Sign Apk
        if: env.SIGNING_KEY != ''
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/sign-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # full history + tags: the release body lists the commit summaries
      # since the previous release tag
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Compute version code
        run: |
          echo "VERSION_CODE=$(( 72 + ${{ github.run_number }} ))" >> $GITHUB_ENV
          echo "VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      # keystore.properties (read by app/build.gradle.kts) makes
      # assembleRelease sign the APK itself; storeFile resolves relative
      # to the app/ module, hence the keystore living in app/
      - name: Set up release signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the ANDROID_RELEASE_SIGNING_KEY/KEY_ALIAS/KEYSTORE_PASSWORD/KEY_PASSWORD secrets are not all configured"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > app/upload.keystore
          # java.util.Properties consumes backslash escapes, so double them
          {
            printf 'storeFile=upload.keystore\n'
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
          } > keystore.properties

      # the debug variant ships in the release as a debugging aid; it is a
      # separate app (the .debug applicationId suffix) signed with the same
      # fixed key as the debug workflow artifacts, so it updates over them
      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Sign debug APK
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/sign-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release.apk libretubex.apk
          mv app/build/outputs/apk/debug/app-debug.apk libretubex-debug.apk

      - name: Get Date and Time
        run: |
          echo "TIME=$(date -u +'%T')" >> $GITHUB_ENV
          echo "DATE=$(date -u +'%d-%m-%Y')" >> $GITHUB_ENV
          echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # collect the commit summaries since the previous release for the
      # release body; gh release list yields the newest existing release's
      # tag (the current release does not exist yet). Upstream tags copied
      # into the fork by cloning are ignored, as they never had releases
      # here and could otherwise hide commits. Without any previous release,
      # fall back to the 15 most recent commits.
      - name: Collect commit summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          prev_tag=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev_tag" ]; then
            echo "::notice::listing commits since $prev_tag"
            git log --format='- %s' "${prev_tag}..HEAD" > "$RUNNER_TEMP/commits.md"
            # cap the list so a big upstream merge cannot blow past the
            # per-env-var size limit (COMMITS becomes an env var) or bury
            # the release page; subjects are single lines, so lines == commits
            count=$(wc -l < "$RUNNER_TEMP/commits.md")
            if [ "$count" -gt 500 ]; then
              head -n 500 "$RUNNER_TEMP/commits.md" > "$RUNNER_TEMP/commits-capped.md"
              echo "- and $((count - 500)) more commits (list truncated)" >> "$RUNNER_TEMP/commits-capped.md"
              mv "$RUNNER_TEMP/commits-capped.md" "$RUNNER_TEMP/commits.md"
            fi
          else
            echo "::notice::no previous release found, listing the 15 most recent commits"
            git log -15 --format='- %s' > "$RUNNER_TEMP/commits.md"
          fi
          {
            echo "COMMITS<<COMMITLIST_EOF"
            cat "$RUNNER_TEMP/commits.md"
            echo "COMMITLIST_EOF"
          } >> "$GITHUB_ENV"

      # each run gets its own release, so previous APKs stay available for
      # downgrades; releases/latest follows the makeLatest flag, not dates
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}
          makeLatest: true
          artifacts: |
            libretubex.apk
            libretubex-debug.apk
          name: LibreTubeX v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}
          body: |
            Automatic release build from ${{ env.DATE }} ${{ env.TIME }} UTC (commit ${{ env.SHA_SHORT }})

            Changes since the previous release:

            ${{ env.COMMITS }}

      # keep the 10 newest per-build releases; manually tagged releases
      # (two-part tags, e.g. v33.0) are never pruned. Releases created with
      # GITHUB_TOKEN cannot trigger other workflows, so this never re-fires CI
      - name: Remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "deleting old build release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
          # remove the legacy rolling release from before per-build releases
          gh release delete nightly --yes --cleanup-tag || true
