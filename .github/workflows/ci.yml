name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

# a new push cancels any run still in flight for the same branch, so an
# older run can never finish last and steal the release "latest" flag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Compile
        run: |
          ./gradlew assembleDebug

      - name: Sign Apk
        continue-on-error: true
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/debug
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: app/build/outputs/apk/debug/app-debug-signed.apk

  release:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: debug-builds
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Compute version code
        run: |
          echo "VERSION_CODE=$(( 72 + ${{ github.run_number }} ))" >> $GITHUB_ENV
          echo "VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename APK
        run: mv "${{ steps.sign.outputs.signedFile }}" "libretubex.apk"

      - name: Get Date and Time
        run: |
          echo "TIME=$(date -u +'%T')" >> $GITHUB_ENV
          echo "DATE=$(date -u +'%d-%m-%Y')" >> $GITHUB_ENV

      # each run gets its own release, so previous APKs stay available for
      # downgrades; releases/latest follows the makeLatest flag, not dates
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}
          makeLatest: true
          artifacts: libretubex.apk
          name: LibreTubeX v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}
          body: |
            Automatic release build from ${{ env.DATE }} ${{ env.TIME }} UTC (commit ${{ github.sha }})

            Version code ${{ env.VERSION_CODE }} — matches the version shown in the app under Settings → About.

      # keep the 10 newest per-build releases; manually tagged releases
      # (two-part tags, e.g. v33.0) are never pruned. Releases created with
      # GITHUB_TOKEN cannot trigger other workflows, so this never re-fires CI
      - name: Remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "deleting old build release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
          # remove the legacy rolling release from before per-build releases
          gh release delete nightly --yes --cleanup-tag || true
